services:
  dcs-postgres:
    image: postgres:15.3-alpine
    container_name: dcs-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - 5432:5432
    networks:
      - elk-network
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 2G
        reservations:
          cpus: '0.05'
          memory: 1G
  init-pgadmin:
    image: alpine:latest
    container_name: init-pgadmin
    user: root
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    command: chown -R 5050:5050 /var/lib/pgadmin

  dcs-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dcs-pgadmin
    restart: always
    depends_on:
      dcs-postgres:
        condition: service_started
      init-pgadmin:
        condition: service_completed_successfully
    environment:
      PGADMIN_DEFAULT_EMAIL: user@localhost.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - 8080:80
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    networks:
      - elk-network

networks:
  elk-network:
    external: true